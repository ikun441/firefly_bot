<!DOCTYPE html>
<html lang="zh-CN" data-theme="firefly-dark" data-particles="on">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="流萤 Firefly · 财报总结优化与财税智能助手" />
  <title>流萤 Firefly · 财报总结优化</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" />
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <!-- 萤火粒子背景 -->
  <canvas id="firefly-canvas" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"></div>

  <!-- ================= 顶栏 ================= -->
  <header class="site-header">
    <!-- 类名与 index/css/main.css 保持一致：外层 .site-header 负责
         吸顶+毛玻璃，内层 .nav 是唯一的 flex 行（高 68px），
         品牌 / 导航 / 操作区都是它的直接子元素。
         早期这里用了 .topbar / .topbar-inner，而 CSS 里根本没有这两个
         选择器，导致整条顶栏完全没样式、操作区被挤到第二行。 -->
    <div class="container">
      <div class="nav">
        <a class="brand" href="#dashboard">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 48 48" width="30" height="30">
              <defs>
                <radialGradient id="ff-glow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#a7f3d0" />
                  <stop offset="55%" stop-color="#5eead4" />
                  <stop offset="100%" stop-color="#14b8a6" />
                </radialGradient>
              </defs>
              <circle cx="24" cy="24" r="13" fill="url(#ff-glow)" opacity="0.92" />
              <circle cx="24" cy="24" r="18" fill="none" stroke="#5eead4" stroke-width="1.1" opacity="0.45" />
              <circle cx="24" cy="24" r="22" fill="none" stroke="#5eead4" stroke-width="0.7" opacity="0.22" />
              <ellipse cx="24" cy="24" rx="20" ry="8" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.5" transform="rotate(-28 24 24)" />
            </svg>
          </div>
          <div class="brand-text">
            <div class="brand-name">流萤 Firefly</div>
            <div class="brand-sub">财报总结优化 · 财税智能助手</div>
          </div>
        </a>

        <ul class="nav-links" id="nav-links"><!-- 由 app.js 填充 --></ul>

        <div class="nav-actions">
          <div class="status-dot" id="mode-badge" hidden>
            <span>演示模式 · 模拟数据</span>
          </div>
          <div class="status-dot is-mock" id="connection-status">
            <!-- 指示灯由 .status-dot::before 伪元素绘制，
                 不要再塞一个真实的 span.dot —— 那样会画出两个圆点。 -->
            <span class="status-label">检测中</span>
          </div>
          <button class="btn-icon" id="bot-toggle" title="协议端状态" aria-label="查看协议端状态">🤖</button>
          <button class="btn-icon" id="particle-toggle" title="萤火粒子背景" aria-label="切换粒子背景">✨</button>
          <button class="btn-icon" id="theme-toggle" title="切换主题" aria-label="切换主题">☀️</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= 主体 ================= -->
  <main id="app-main">
    <!-- 占位：首屏骨架，被首个视图替换 -->
    <div class="page-view" id="view-boot">
      <div class="container">
        <div class="skeleton" style="height: 180px; border-radius: 20px; margin-bottom: 20px"></div>
        <div class="grid grid-4">
          <div class="skeleton skeleton-stat"></div>
          <div class="skeleton skeleton-stat"></div>
          <div class="skeleton skeleton-stat"></div>
          <div class="skeleton skeleton-stat"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ================= 页脚 ================= -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="firefly-dot"></span>
        <span id="footer-app-name">流萤 Firefly</span>
        <span id="footer-version" class="footer-version">v1.0.0</span>
      </div>
      <div class="footer-note">
        数据仅供参考，不构成专业税务意见 · 交互快捷键 <kbd>Alt</kbd>+<kbd>1</kbd>~<kbd>6</kbd>
      </div>
    </div>
  </footer>

  <!-- 全局组件挂载点 -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root" class="modal-root"></div>
  <div id="loading-mask" class="loading-mask" hidden>
    <div class="loading-box">
      <div class="firefly-spinner"><span></span><span></span><span></span></div>
      <div class="loading-text">流萤正在生成…</div>
    </div>
  </div>

  <!-- ================= 脚本（顺序敏感） ================= -->
  <script src="./js/utils.js"></script>
  <script src="./js/mock.js"></script>
  <script src="./js/api.js"></script>
  <!-- auth.js 必须在 app.js 之前：app.js 启动时要先问「本部署要不要登录」 -->
  <script src="./js/auth.js"></script>
  <script src="./js/particles.js"></script>
  <script src="./js/views.js"></script>
  <script src="./js/collector.js"></script>
    <script src="./js/ledger.js"></script>
  <script src="./js/push-options.js"></script>
  <script src="./js/report.js"></script>
  <script src="./js/assistant.js"></script>
  <script src="./js/budget-settings.js"></script>
  <script src="./js/bot-status.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
